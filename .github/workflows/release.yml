name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.1). Publishes as a prerelease.'
        required: true

# Least privilege by default; the publish job opts up to write.
permissions:
  contents: read

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      file_version: ${{ steps.meta.outputs.file_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # tags, for the version string

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kimageformats
            mingw-w64-ucrt-x86_64-libavif
            mingw-w64-ucrt-x86_64-libheif
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-karchive
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-mpv
            zip

      - id: meta
        name: Determine version
        run: |
          # Prefer the tag; fall back to the CMake project version so a
          # manual run on an untagged tree still produces something sane.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            v="${{ github.event.inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v="v$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)-dev"
            skip_check=1   # derived from CMakeLists, so it cannot disagree
          fi

          # Bumping project(VERSION) is a manual edit, easy to forget, and
          # nothing else would notice: you would get a release named v2.0.1
          # containing a binary that reports 2.0.0. Compare them and stop here
          # instead. A -rc1 / -beta suffix on the tag is allowed.
          project_version=$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)
          tag_version=${v#v}
          tag_version=${tag_version%%-*}
          if [ -z "${skip_check:-}" ] && [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag $v does not match project(VERSION) $project_version in CMakeLists.txt."
            echo "::error::Bump CMakeLists.txt (and qimgv/distrib/qimgv.appdata.xml) or retag."
            exit 1
          fi

          # Three forms, because they are not interchangeable: the tag names the
          # release, the bare project version is all VersionInfoVersion accepts,
          # and the filename form keeps a -dev suffix without the leading v.
          file_version=${v#v}
          echo "version=${v}" >> $GITHUB_OUTPUT
          echo "file_version=${file_version}" >> $GITHUB_OUTPUT
          echo "project_version=${project_version}" >> $GITHUB_OUTPUT
          echo "Building ${v} (project version ${project_version})"

      # --- full build: everything on -------------------------------------
      - name: Build
        run: |
          cmake --preset windows-msys2
          cmake --build --preset windows-msys2

      # Not "|| true": a release that fails its own tests should not ship.
      # The windows-msys2 preset builds them, so ctest has something to run;
      # it previously pointed at a preset whose build tree had no tests and
      # swallowed the resulting error.
      - name: Test
        run: ctest --test-dir build/windows-msys2 --output-on-failure

      - name: Package (full)
        run: |
          ./scripts/package-windows.sh
          cd build
          rm -rf "qimgv-${{ steps.meta.outputs.file_version }}-win64"
          mv dist "qimgv-${{ steps.meta.outputs.file_version }}-win64"
          zip -qr "qimgv-${{ steps.meta.outputs.file_version }}-win64.zip" \
                  "qimgv-${{ steps.meta.outputs.file_version }}-win64"
          # The installer is built from this tree, so put it back where the
          # .iss expects it rather than leaving it under the versioned name.
          mv "qimgv-${{ steps.meta.outputs.file_version }}-win64" dist

      # --- minimal build: no video, no exiv2, no OpenCV --------------------
      # Roughly half the size of the full package. Zip only: the installer is
      # the "just give me the app" path, and a second one to test and keep in
      # step would buy little for people who are already happy to unzip.
      - name: Build (minimal)
        run: |
          cmake --preset minimal
          cmake --build --preset minimal

      - name: Package (minimal)
        run: |
          BUILD_DIR=build/minimal DIST_DIR=build/dist-minimal ./scripts/package-windows.sh
          cd build
          rm -rf "qimgv-${{ steps.meta.outputs.file_version }}-win64-minimal"
          mv dist-minimal "qimgv-${{ steps.meta.outputs.file_version }}-win64-minimal"
          zip -qr "qimgv-${{ steps.meta.outputs.file_version }}-win64-minimal.zip" \
                  "qimgv-${{ steps.meta.outputs.file_version }}-win64-minimal"

      # --- installer, built from the full tree -----------------------------
      - name: Build installer
        run: |
          # Preinstalled on the runner image, but not on PATH, and an image
          # change should fail loudly rather than quietly publishing a release
          # with one of its three artifacts missing.
          iscc=""
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
                           "/c/Program Files/Inno Setup 6/ISCC.exe" \
                           "${LOCALAPPDATA:+$(cygpath -u "$LOCALAPPDATA")/Programs/Inno Setup 6/ISCC.exe}" \
                           "$(command -v iscc 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then iscc="$candidate"; break; fi
          done
          if [ -z "$iscc" ]; then
            echo "::error::Inno Setup (ISCC.exe) not found on this runner; cannot build the installer"
            exit 1
          fi
          echo "using $iscc"
          # AppVersion feeds VersionInfoVersion, which only accepts x.y.z, so it
          # gets the bare project version while the filename keeps any -dev
          # suffix the tag carried.
          "$iscc" //DAppVersion=${{ steps.meta.outputs.project_version }} \
                  //F"qimgv-${{ steps.meta.outputs.file_version }}-win64-setup" \
                  scripts/qimgv.iss
          ls -lh build/*.exe

      - name: Show what will be published
        run: ls -lh build/*.zip build/*.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qimgv-win64
          path: |
            build/*.zip
            build/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # creates the release
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: qimgv-win64
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          # The installer is checksummed too. It is the artifact most people
          # will run, and an unsigned setup.exe is exactly the thing worth
          # being able to verify.
          sha256sum *.zip *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A release that quietly ships two of its three artifacts is worse than
      # one that fails, so check before anything is published.
      - name: Verify all three artifacts are present
        run: |
          missing=0
          for f in "qimgv-${{ needs.windows.outputs.file_version }}-win64.zip"                    "qimgv-${{ needs.windows.outputs.file_version }}-win64-minimal.zip"                    "qimgv-${{ needs.windows.outputs.file_version }}-win64-setup.exe"; do
            if [ -f "dist/$f" ]; then
              echo "  ok      $f"
            else
              echo "::error::missing release artifact: $f"
              missing=1
            fi
          done
          exit $missing

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.windows.outputs.version }}
          name: qimgv ${{ needs.windows.outputs.version }}
          draft: true            # review before it goes public
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          # Prepended to the notes GitHub generates, so every release explains
          # which file to take and how to upgrade without anyone having to
          # remember to write it. Full detail lives in docs/INSTALL.md.
          body: |
            ### Which download?

            | File | Use it if |
            |---|---|
            | `qimgv-${{ needs.windows.outputs.file_version }}-win64-setup.exe` | You want it installed like a normal app. **Start here.** |
            | `qimgv-${{ needs.windows.outputs.file_version }}-win64.zip` | You want it portable, with nothing written outside the folder. |
            | `qimgv-${{ needs.windows.outputs.file_version }}-win64-minimal.zip` | Images only — no video playback, smallest download. |

            All three read the same image formats, including AVIF, HEIF and JPEG XL.
            The minimal build drops video playback and the OpenCV scaling filters.

            ### Upgrading

            **Installed:** run the new installer. It replaces the existing install
            and keeps your settings — no need to uninstall first.

            **Portable:** extract to a new folder and copy your old `conf` folder
            across.

            ### Notes

            The installer is per-user and needs no administrator rights. It is not
            code signed, so Windows may warn about an unknown publisher — verify
            against `SHA256SUMS.txt` below.

            Installing, upgrading, file associations and where settings live are all
            covered in [docs/INSTALL.md](https://github.com/duckautomata/qimgv/blob/master/docs/INSTALL.md).

            ---
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
