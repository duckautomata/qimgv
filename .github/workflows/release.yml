name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.1.0). Publishes as a prerelease.'
        required: true

permissions:
  contents: write   # needed to create the release

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, for the version string

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-kimageformats
            mingw-w64-ucrt-x86_64-opencv
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-mpv
            zip

      - id: meta
        name: Determine version
        run: |
          # Prefer the tag; fall back to the CMake project version so a
          # manual run on an untagged tree still produces something sane.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            v="${{ github.event.inputs.tag }}"
          elif [ -n "${GITHUB_REF_NAME}" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME}"
          else
            v="v$(grep -oP 'VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1)-dev"
          fi
          echo "version=${v}" >> $GITHUB_OUTPUT
          echo "Building ${v}"

      - name: Build
        run: |
          cmake --preset windows-msys2
          cmake --build --preset windows-msys2

      - name: Test
        run: ctest --preset ci --test-dir build/windows-msys2 || true

      - name: Package
        run: |
          ./scripts/package-windows.sh
          cd build
          mv dist "qimgv-${{ steps.meta.outputs.version }}-win64"
          zip -qr "qimgv-${{ steps.meta.outputs.version }}-win64.zip" \
                  "qimgv-${{ steps.meta.outputs.version }}-win64"
          ls -lh *.zip

      - uses: actions/upload-artifact@v7
        with:
          name: qimgv-win64
          path: build/*.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: qimgv-win64
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.windows.outputs.version }}
          name: qimgv ${{ needs.windows.outputs.version }}
          draft: true            # review before it goes public
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
